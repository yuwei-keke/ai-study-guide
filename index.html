<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 学习指导书</title>
  <meta name="description" content="面向零基础学生的 AI 学习知识库，包含 AI 基础知识、编程入门、AI Agent 使用指南和提示词教程，用通俗语言帮助你从零开始学习 AI。">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <!-- Markdown 渲染库（锁定 v4 版本，v5+ 的 API 不兼容）-->
  <script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js"></script>
  <!-- 代码高亮 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/highlight.min.js"></script>
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="header">
    <div class="header-left">
      <button class="menu-toggle" id="menuToggle" aria-label="切换菜单">☰</button>
      <h1 class="logo">📘 AI 学习指导书</h1>
    </div>
    <div class="header-right">
      <input type="text" class="search-input" id="searchInput" placeholder="搜索知识点...">
      <a href="#home" class="home-btn" id="homeBtn" title="返回首页">🏠</a>
      <button class="theme-toggle" id="themeToggle" aria-label="切换暗色模式">🌙</button>
    </div>
  </header>

  <div class="main-layout">
    <!-- 左侧导航栏 -->
    <aside class="sidebar" id="sidebar">
      <nav class="nav" id="navContainer">
        <!-- 导航内容由 JS 动态生成 -->
      </nav>
    </aside>

    <!-- 右侧内容区 -->
    <main class="content" id="mainContent">
      <!-- 内容由 JS 动态加载 -->
      <div class="loading">加载中...</div>
    </main>
  </div>

  <!-- 搜索结果弹窗 -->
  <div class="search-results" id="searchResults" style="display:none;">
    <div class="search-results-header">
      <span>搜索结果</span>
      <button class="search-close" id="searchClose">✕</button>
    </div>
    <div class="search-results-list" id="searchResultsList"></div>
  </div>

  <!-- 返回顶部按钮 -->
  <button class="back-to-top" id="backToTop" aria-label="返回顶部">↑</button>

  <script src="js/content-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
